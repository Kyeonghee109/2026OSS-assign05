<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule_Table</title>
    <script>
        let scheduleList = [
            {
                id: 1,
                subject: "OSS",
                section: "1분반",
                time: "09:00",
                professor: "장소연",
                location: "NTH 414"
            },
            {
                id: 2,
                subject: "컴퓨터구조",
                section: "1분반",
                time: "15:00",
                professor: "용환기",
                location: "NTH 220"
            },
            {
                id: 3,
                subject: "이산수학",
                section: "1분반",
                time: "13:30",
                professor: "최희열",
                location: "NTH 313"
            }
        ];

        window.addEventListener("load", function(){
            const addbtn = document.querySelector("#addbtn");
            const subject = document.querySelector("#subject");
            const section = document.querySelector("#section");
            const time = document.querySelector("#time");
            const professor = document.querySelector("#professor");
            const place = document.querySelector("#location");
            const list = document.querySelector("#list");
            let editIndex = -1; 

            function render(){
                list.innerHTML = "";
                for(let i = 0; i < scheduleList.length; i++){
                    const tr = document.createElement("tr");
                    
                    const tdSubject = document.createElement("td");
                    tdSubject.textContent = scheduleList[i].subject;
                    
                    const tdSection = document.createElement("td");
                    tdSection.textContent = scheduleList[i].section;
                    
                    const tdTime = document.createElement("td");
                    tdTime.textContent = scheduleList[i].time;
                    
                    const tdProfessor = document.createElement("td");
                    tdProfessor.textContent = scheduleList[i].professor;
                    
                    const tdLocation = document.createElement("td");
                    tdLocation.textContent = scheduleList[i].location;
                    
                    tr.appendChild(tdSubject);
                    tr.appendChild(tdSection);
                    tr.appendChild(tdTime);
                    tr.appendChild(tdProfessor);
                    tr.appendChild(tdLocation);
                    
                    list.appendChild(tr);

                    const btnE = document.createElement("button");
                    btnE.textContent = "Edit";

                    const tdEdit = document.createElement("td");
                    tdEdit.appendChild(btnE);
                    tr.appendChild(tdEdit);

                    


                    btnE.addEventListener("click",function(){
                        subject.value = scheduleList[i].subject;
                        section.value = scheduleList[i].section;
                        time.value = scheduleList[i].time;
                        professor.value = scheduleList[i].professor;
                        place.value = scheduleList[i].location;

                        editIndex = i;
                        
                        addbtn.textContent = "Submit";
                    });

                    const btnX = document.createElement("button");
                    btnX.textContent = "Delete";

                    const tdDelete = document.createElement("td");
                    tdDelete.appendChild(btnX);
                    tr.appendChild(tdDelete);
                    btnX.addEventListener("click",function(){
                        if(confirm("정말 삭제할까요?")){
                            scheduleList.splice(i, 1);

                            editIndex = -1;
                            addbtn.textContent = "ADD";
                            subject.value = "";
                            section.value = "";
                            time.value = "";
                            professor.value = "";
                            place.value = "";

                            render();
                        }   
                    });
                }
            }

            addbtn.addEventListener("click",function(){
                if (subject.value.trim() === "" || section.value.trim() === "" || time.value.trim() === "" || professor.value.trim() === "" ||  place.value.trim() === "") {
                    alert("모든 칸을 입력하세요.");

                    if (subject.value.trim() === "") {subject.focus();} 
                    else if (section.value.trim() === "") {section.focus();} 
                    else if (time.value.trim() === "") {time.focus();} 
                    else if (professor.value.trim() === "") {professor.focus();} 
                    else if (place.value.trim() === "") {place.focus();}

                    return;
                }

                const timePattern = /^([01]\d|2[0-3]):[0-5]\d$/;

                if (!timePattern.test(time.value)) {
                    alert("시간은 09:00 형식으로 입력하세요.");
                    time.focus();
                    return;
                }

                const sectionPattern = /^\d+분반$/;

                if (!sectionPattern.test(section.value.trim())) {
                    alert("분반은 1분반 형식으로 입력하세요.");
                    section.focus();
                    return;
                }

                const d = scheduleList.findIndex(function (item) {
                    return item.subject === subject.value && item.section === section.value.trim();
                });
                if (d !== -1 && d !== editIndex) {
                    alert("이미 있는 과목입니다.");
                    return;
                }

                if(editIndex === -1){
                    scheduleList.push({
                        subject: subject.value,
                        section: section.value.trim(),
                        time: time.value,
                        professor: professor.value,
                        location: place.value
                    });
                }else{
                    scheduleList[editIndex] = {
                        subject: subject.value,
                        section: section.value.trim(),
                        time: time.value,
                        professor: professor.value,
                        location: place.value
                    };
                    editIndex = -1;
                    addbtn.textContent = "ADD";
                }
                

                subject.value = "";
                section.value = "";
                time.value = "";
                professor.value = "";
                place.value = "";
                
                render();
            });
            render();
        });
    </script>
    <style>
        body{
            background-color: rgba(232, 177, 241, 0.933);
            font-family: Arial, sans-serif;
            max-width: 800px;
            padding: 10px auto; 
        }

        table, th{
            background-color: rgb(255 255 255 / 0.8);
            border: 1px solid none;
            padding: 10px;
            text-align: center;
            margin: 0 auto;
        }

        input{
            padding: 5px;
            margin: 3px;
            border: 1px solid #ccc;
            width: 200px;
        }

        button{
            padding: 5px 10px;
            margin: 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
        }
    </style>
</head>
<body>
    <input type="text" id="subject" placeholder="과목을 입력하세요."/><br>
    <input type="text" id="section" placeholder="분반을 입력하세요."/><br>
    <input type="text" id="time" placeholder="시작시간을 입력하세요."/><br>
    <input type="text" id="professor" placeholder="교수님을 입력하세요."/><br>
    <input type="text" id="location" placeholder="장소를 입력하세요."/><br><br>
    <button id="addbtn">ADD</button><br><br>
    
    <h2>시간표</h2>
    <table id="scheduleTable">
        <thead>
            <tr>
                <th>과목</th>
                <th>분반</th>
                <th>시작시간</th>
                <th>교수님</th>
                <th>장소</th>
                <th>수정</th>
                <th>삭제</th>
            </tr>
        </thead>
        <tbody id="list">
        </tbody>
    </table>
</body>
</html>
